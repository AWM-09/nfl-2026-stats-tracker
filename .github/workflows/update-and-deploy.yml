name: Update NFL stats and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/London'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download weekly player stats for 2020–2026 (regular season and playoffs)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          download_asset() {
            local year="$1"
            local filename="$2"
            local output="data/stats_player_week_${year}.csv"
            local url

            for release in stats_player player_stats; do
              url="https://github.com/nflverse/nflverse-data/releases/download/${release}/${filename}"
              if curl --silent --show-error --fail --location --retry 2 "$url" --output "${output}.tmp"; then
                if test -s "${output}.tmp" && head -n 1 "${output}.tmp" | grep -qi 'week'; then
                  mv "${output}.tmp" "$output"
                  echo "Downloaded ${filename} for ${year}"
                  return 0
                fi
              fi
              rm -f "${output}.tmp"
            done
            return 1
          }

          for year in 2020 2021 2022 2023 2024 2026; do
            echo "Downloading weekly player statistics for ${year}"
            download_asset "$year" "stats_player_week_${year}.csv" || {
              echo "::error::Could not find the weekly player-stat CSV for ${year}."
              exit 1
            }
          done

          echo "Downloading player statistics for 2025"
          if ! download_asset 2025 stats_player_week_2025.csv; then
            reg="$(mktemp)"
            post="$(mktemp)"
            got_reg=false
            got_post=false

            for release in stats_player player_stats; do
              for filename in stats_player_reg_2025.csv player_stats_reg_2025.csv; do
                url="https://github.com/nflverse/nflverse-data/releases/download/${release}/${filename}"
                if curl --silent --show-error --fail --location --retry 2 "$url" --output "$reg" && test -s "$reg"; then
                  got_reg=true
                  break 2
                fi
              done
            done

            for release in stats_player player_stats; do
              for filename in stats_player_post_2025.csv player_stats_post_2025.csv; do
                url="https://github.com/nflverse/nflverse-data/releases/download/${release}/${filename}"
                if curl --silent --show-error --fail --location --retry 2 "$url" --output "$post" && test -s "$post"; then
                  got_post=true
                  break 2
                fi
              done
            done

            if [[ "$got_reg" == true ]]; then
              cp "$reg" data/stats_player_week_2025.csv
              if [[ "$got_post" == true ]]; then
                tail -n +2 "$post" >> data/stats_player_week_2025.csv
              fi
            else
              echo "::error::Could not locate the 2025 player-stat CSV assets."
              exit 1
            fi

            rm -f "$reg" "$post"
          fi

          for year in 2020 2021 2022 2023 2024 2025 2026; do
            test -s "data/stats_player_week_${year}.csv"
            head -n 1 "data/stats_player_week_${year}.csv" | grep -qi 'week'
          done

      - name: Download Next Gen Stats passing data
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 \
            "https://github.com/nflverse/nflverse-data/releases/download/nextgen_stats/ngs_passing.csv.gz" \
            --output data/ngs_passing.csv
          test -s data/ngs_passing.csv.gz
          gzip -dc data/ngs_passing.csv.gz > data/ngs_passing.csv
          test -s data/ngs_passing.csv
          head -n 1 data/ngs_passing.csv | grep -q 'avg_time_to_throw'

      - name: Merge average time to throw into weekly player stats
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import re
          import unicodedata
          from pathlib import Path

          def norm(value):
              value = unicodedata.normalize("NFKD", str(value or ""))
              value = "".join(c for c in value if not unicodedata.combining(c))
              return re.sub(r"[^a-z0-9]", "", value.lower())

          def integer(value):
              try:
                  return int(float(str(value).strip()))
              except (ValueError, TypeError):
                  return None

          ngs_path = Path("data/ngs_passing.csv")
          with ngs_path.open(newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              ngs_rows = list(reader)
              ngs_headers = reader.fieldnames or []

          required = {
              "season", "week", "player_display_name",
              "team_abbr", "season_type", "avg_time_to_throw"
          }
          missing = required.difference(ngs_headers)
          if missing:
              raise SystemExit(
                  f"NGS CSV missing expected columns: {sorted(missing)}"
              )

          # nflverse NGS uses regular-season week numbers and postseason
          # week numbers separately. Preserve season type in the join key.
          index = {}
          for row in ngs_rows:
              season = integer(row.get("season"))
              week = integer(row.get("week"))
              value = (row.get("avg_time_to_throw") or "").strip()
              if season is None or week is None or not value:
                  continue

              season_type = (row.get("season_type") or "").strip().upper()
              key = (
                  season, week, season_type,
                  norm(row.get("player_display_name")),
                  norm(row.get("team_abbr"))
              )
              index[key] = value

          total_matched = 0
          for path in sorted(Path("data").glob("stats_player_week_*.csv")):
              with path.open(newline="", encoding="utf-8-sig") as f:
                  reader = csv.DictReader(f)
                  rows = list(reader)
                  headers = reader.fieldnames or []

              def find_column(candidates):
                  lookup = {h.lower(): h for h in headers}
                  return next(
                      (lookup[c.lower()] for c in candidates
                       if c.lower() in lookup),
                      None
                  )

              season_col = find_column(["season"])
              week_col = find_column(["week"])
              name_col = find_column(
                  ["player_display_name", "player_name", "name"]
              )
              team_col = find_column(
                  ["team_abbr", "recent_team", "team"]
              )
              type_col = find_column(["season_type"])

              if not all([season_col, week_col, name_col, team_col]):
                  raise SystemExit(
                      f"Cannot identify season/week/player/team columns in "
                      f"{path}. Columns found: {headers}"
                  )

              if "avg_time_to_throw" not in headers:
                  headers.append("avg_time_to_throw")

              matched = 0
              for row in rows:
                  row["avg_time_to_throw"] = ""
                  season = integer(row.get(season_col))
                  week = integer(row.get(week_col))
                  if season is None or week is None or week == 0:
                      continue

                  season_type = (
                      (row.get(type_col) or "").strip().upper()
                      if type_col else ("POST" if week > 18 else "REG")
                  )
                  # nflverse player-week files usually use weeks 1-18 for
                  # regular season and 19+ for playoffs. Convert playoff
                  # week to the NGS postseason-relative week number.
                  ngs_week = week - 18 if season_type == "POST" and week >= 19 else week
                  key = (
                      season, ngs_week, season_type,
                      norm(row.get(name_col)), norm(row.get(team_col))
                  )
                  value = index.get(key)
                  if value is not None:
                      row["avg_time_to_throw"] = value
                      matched += 1

              with path.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(
                      f, fieldnames=headers, extrasaction="ignore"
                  )
                  writer.writeheader()
                  writer.writerows(rows)

              total_matched += matched
              print(
                  f"{path}: matched {matched}/{len(rows)} player-week rows"
              )

          print(f"Total matched player-week rows: {total_matched}")
          PY

      - name: Download NFL schedule and scores
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv"

          curl --silent --show-error --fail --location --retry 3 \
            "$url" --output data/schedule.csv.tmp

          test -s data/schedule.csv.tmp

          header="$(head -n 1 data/schedule.csv.tmp)"
          for column in season week gameday gametime home_team away_team; do
            if ! printf '%s\n' "$header" | grep -qE "(^|,)${column}(,|$)"; then
              echo "::error::Schedule CSV is missing required column: ${column}"
              exit 1
            fi
          done

          mv data/schedule.csv.tmp data/schedule.csv
          echo "NFL schedule downloaded successfully."
          echo "Schedule rows: $(($(wc -l < data/schedule.csv) - 1))"

      - name: Prepare dashboard files
        run: |
          set -euo pipefail
          mkdir -p site/data
          cp index.html site/index.html
          cp data/stats_player_week_*.csv site/data/
          cp data/schedule.csv site/data/schedule.csv

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard
        uses: actions/deploy-pages@v4

```yaml
name: Update NFL stats and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest NFL statistics
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 3 \
            'https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv' \
            --output data/stats_player_week_2026.csv
          test -s data/stats_player_week_2026.csv
          head -n 1 data/stats_player_week_2026.csv | grep -qi 'week'

      - name: Prepare dashboard files
        run: |
          set -euo pipefail
          mkdir -p site/data
          cp index.html site/index.html
          cp data/stats_player_week_2026.csv site/data/stats_player_week_2026.csv

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard
        uses: actions/deploy-pages@v4
```

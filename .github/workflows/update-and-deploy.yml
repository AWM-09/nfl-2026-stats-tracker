name: Update NFL stats and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/London'
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest 2026 NFL statistics
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 3 \
            'https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv' \
            --output data/stats_player_week_2026.csv
          test -s data/stats_player_week_2026.csv
          head -n 1 data/stats_player_week_2026.csv | grep -qi 'week'

      - name: Download historical NFL statistics (2020–2025)
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2020 2021 2022 2023 2024 2025; do
            echo "Downloading player statistics for ${year}"
            curl --fail --location --retry 3 \
              "https://github.com/nflverse/nflverse-data/releases/download/player_stats/stats_player_week_${year}.csv" \
              --output "data/stats_player_week_${year}.csv"
            test -s "data/stats_player_week_${year}.csv"
            head -n 1 "data/stats_player_week_${year}.csv" | grep -qi 'week'
          done

      - name: Prepare dashboard files
        run: |
          set -euo pipefail
          mkdir -p site/data
          cp index.html site/index.html
          cp data/stats_player_week_*.csv site/data/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard
        uses: actions/deploy-pages@v4

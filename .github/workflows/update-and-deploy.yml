
name: Update NFL stats and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/stats_player_week_2026.csv'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest NFL statistics
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --retry 3 \
            'https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv' \
            --output data/stats_player_week_2026.csv
          test -s data/stats_player_week_2026.csv
          head -n 1 data/stats_player_week_2026.csv | grep -qi 'week'

      - name: Save updated statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stats_player_week_2026.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL player stats data'
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy dashboard
        uses: actions/deploy-pages@v4
